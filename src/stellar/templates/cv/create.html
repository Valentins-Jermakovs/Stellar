{% extends "base.html" %}


{% block title %}
    Create CV — Stellar
{% endblock %}


{% block content %}

<div class="min-h-[calc(100vh-73px)] bg-base-200/40">

    <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">

        <header class="mb-8">

            <div class="mb-4 flex items-center gap-3">

                <span class="h-2 w-2 bg-primary"></span>

                <span
                    class="
                        text-xs
                        font-bold
                        uppercase
                        tracking-[0.2em]
                        text-primary
                    "
                >
                    CV Builder
                </span>

            </div>

            <h1
                class="
                    text-3xl
                    font-bold
                    tracking-tight
                    sm:text-4xl
                    lg:text-5xl
                "
            >
                Create your CV
            </h1>

            <p
                class="
                    mt-3
                    max-w-2xl
                    text-sm
                    leading-relaxed
                    text-base-content/60
                    sm:text-base
                "
            >
                Build a professional CV with Stellar.
            </p>

        </header>


        <section
            class="
                border
                border-base-300
                bg-base-100
            "
        >

            <div class="p-6 sm:p-8">

                <h2 class="text-lg font-semibold">
                    New CV
                </h2>

                <p class="mt-2 text-sm text-base-content/50">
                    Your CV builder will appear here.
                </p>

            </div>

        </section>

    </div>

</div>

{% endblock %}
