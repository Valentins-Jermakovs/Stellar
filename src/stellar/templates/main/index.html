{% extends "base.html" %}


{% block title %}
    Stellar — CV Builder
{% endblock %}


{% block content %}

<section class="min-h-[calc(100vh-64px)] flex items-center">

    <div class="container mx-auto px-6">

        <div class="max-w-3xl">

            <div class="badge badge-primary mb-6">
                CV Builder
            </div>


            <h1 class="text-6xl font-bold leading-tight">

                Build a CV
                <span class="text-primary">
                    that stands out.
                </span>

            </h1>


            <p class="mt-6 max-w-2xl text-xl opacity-70">

                Create a professional CV with modern templates,
                multilingual support and easy PDF export.

            </p>


            <div class="mt-8 flex gap-4">

                <button class="btn btn-primary btn-lg">
                    Create your CV
                </button>

                <button class="btn btn-outline btn-lg">
                    Explore templates
                </button>

            </div>

        </div>

    </div>

</section>

{% endblock %}
