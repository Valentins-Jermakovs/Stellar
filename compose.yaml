
services:

  # ==============================
  # Stellar API
  # ==============================

  stellar:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: stellar

    env_file:
      - .env

    ports:
      - "8001:8001"

    depends_on:
      stellar_db:
        condition: service_healthy
      stellar_redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8001/openapi.json', timeout=3); assert response.status == 200"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

    networks:
      back_end:
        aliases:
          - stellar-api


  # ==============================
  # PostgreSQL
  # ==============================

  stellar_db:
    image: postgres:18

    container_name: stellar_db

    environment:
      POSTGRES_DB: stellar
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    ports:
      - "5440:5432"

    volumes:
      - stellar_db_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d stellar"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - back_end


  # ==============================
  # Redis
  # ==============================

  stellar_redis:
    image: redis:8-alpine

    container_name: stellar_redis

    ports:
      - "6380:6379"

    volumes:
      - stellar_redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - back_end


# ==============================
# Persistent Volumes
# ==============================

volumes:
  stellar_db_data:
  stellar_redis_data:


# ==============================
# External Network
# ==============================

networks:
  back_end:
    external: true
