services:

  stellar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stellar
    env_file:
      - .env
    ports:
      - "8002:8002"
    depends_on:
      stellar_db:
        condition: service_healthy
      stellar_redis:
        condition: service_healthy
    restart: unless-stopped

  stellar_db:
    image: postgres:18
    container_name: stellar_db
    environment:
      POSTGRES_DB: stellar
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5440:5432"
    volumes:
      - stellar_db_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U admin -d stellar"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  stellar_redis:
    image: redis:8-alpine
    container_name: stellar_redis
    ports:
      - "6380:6379"
    volumes:
      - stellar_redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  stellar_db_data:
  stellar_redis_data: